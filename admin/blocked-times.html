<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Heures bloquées — Panel admin — Tacti Shine QC</title>
<style>
    body {
        font-family: system-ui, sans-serif;
        background: #0a0c09;
        color: #fff;
        margin: 0;
        padding: 40px;
    }

    h1 { margin: 0 0 24px; }

    #back-link {
        color: #8fbf95;
        text-decoration: none;
        font-size: 14px;
    }

    form {
        background: #0c0f0b;
        border: 1px solid #2a2e26;
        border-radius: 10px;
        padding: 20px;
        margin: 24px 0;
        max-width: 480px;
    }

    label {
        display: block;
        font-size: 13px;
        color: #aaa;
        margin: 12px 0 4px;
    }

    input {
        width: 100%;
        padding: 8px 10px;
        background: #111;
        border: 1px solid #2a2e26;
        border-radius: 6px;
        color: #fff;
        box-sizing: border-box;
        font-family: inherit;
    }

    .time-row {
        display: flex;
        gap: 10px;
    }

    .time-row > div { flex: 1; }

    button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        border-radius: 6px;
        padding: 8px 14px;
        font-size: 13px;
    }

    #submit-btn {
        margin-top: 16px;
        background: #3d9e4f;
        color: #fff;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
    }

    th, td {
        text-align: left;
        padding: 10px 12px;
        border-bottom: 1px solid #2a2e26;
        font-size: 14px;
    }

    th { color: #888; font-weight: 500; }

    .btn-danger { background: #7a2b2b; color: #fff; }

    #empty {
        color: #888;
        margin-top: 16px;
        display: none;
    }
</style>
</head>
<body>

    <a href="/admin" id="back-link">&larr; Retour au panel</a>
    <h1>Heures bloquées</h1>
    <p style="color:#888;">
        Bloque une journée complète (vacances, congé) ou seulement une plage
        d'heures (ex: rendez-vous personnel, pause). Les créneaux bloqués
        n'apparaîtront plus comme disponibles sur le calendrier public.
    </p>

    <form id="block-form">

        <label for="field-date">Date</label>
        <input type="date" id="field-date" required>

        <label>
            <input type="checkbox" id="field-whole-day" checked style="width:auto;display:inline-block;">
            Bloquer la journée complète
        </label>

        <div id="time-fields" class="time-row" style="display:none;">
            <div>
                <label for="field-start">De</label>
                <input type="time" id="field-start">
            </div>
            <div>
                <label for="field-end">À</label>
                <input type="time" id="field-end">
            </div>
        </div>

        <label for="field-reason">Raison (optionnel, pour toi seulement)</label>
        <input type="text" id="field-reason" placeholder="ex: Vacances, rendez-vous perso...">

        <button type="submit" id="submit-btn">Bloquer</button>

    </form>


    <h2>Blocages à venir</h2>

    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Heures</th>
                <th>Raison</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="blocks-body"></tbody>
    </table>

    <p id="empty">Aucun blocage à venir.</p>


    <script>

        function escapeHtml(str) {
            const div = document.createElement("div");
            div.textContent = str || "";
            return div.innerHTML;
        }


        document.getElementById("field-whole-day").addEventListener("change", (e) => {
            document.getElementById("time-fields").style.display =
                e.target.checked ? "none" : "flex";
        });


        async function loadBlocks() {

            const response = await fetch("/api/admin/blocked-times");

            if (response.status === 401) {
                window.location.href = "/admin/login.html";
                return;
            }

            const data = await response.json();
            renderTable(data.blockedTimes);
        }


        function renderTable(blocks) {

            const body = document.getElementById("blocks-body");
            const empty = document.getElementById("empty");

            if (blocks.length === 0) {
                body.innerHTML = "";
                empty.style.display = "block";
                return;
            }

            empty.style.display = "none";

            body.innerHTML = blocks.map(b => `
                <tr>
                    <td>${escapeHtml(b.date)}</td>
                    <td>${b.wholeDay ? "Journée complète" : `${escapeHtml(b.startTime)} → ${escapeHtml(b.endTime)}`}</td>
                    <td>${escapeHtml(b.reason) || "—"}</td>
                    <td><button class="btn-danger" onclick="removeBlock('${b.id}')">Retirer</button></td>
                </tr>
            `).join("");
        }


        document.getElementById("block-form").addEventListener("submit", async (e) => {

            e.preventDefault();

            const wholeDay = document.getElementById("field-whole-day").checked;

            const payload = {
                date: document.getElementById("field-date").value,
                startTime: wholeDay ? null : document.getElementById("field-start").value,
                endTime: wholeDay ? null : document.getElementById("field-end").value,
                reason: document.getElementById("field-reason").value.trim()
            };

            const response = await fetch("/api/admin/blocked-times", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const data = await response.json().catch(() => ({}));
                alert(data.error || "Erreur lors du blocage.");
                return;
            }

            document.getElementById("block-form").reset();
            document.getElementById("field-whole-day").checked = true;
            document.getElementById("time-fields").style.display = "none";

            loadBlocks();
        });


        window.removeBlock = async function (id) {

            if (!confirm("Retirer ce blocage ?")) {
                return;
            }

            await fetch(`/api/admin/blocked-times?id=${encodeURIComponent(id)}`, {
                method: "DELETE"
            });

            loadBlocks();
        };


        loadBlocks();

    </script>

</body>
</html>
